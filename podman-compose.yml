version: "3.8"

services:
  dev-deck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-deck
    working_dir: /app
    volumes:
      - .:/app:z
      - ../..:/app/docs:z
      - /app/docs/.dev-deck
      - ../hugo.yaml:/app/hugo.yaml:z
      - ../assets:/app/custom-assets:z
      - ../database:/app/database:z
    ports:
      - "5180:5180"
      - "5182:5182"
      - "5179:5179"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
